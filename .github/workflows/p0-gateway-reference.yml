name: MOCHIFX P0 Reference Gateway Policy

on:
  pull_request:
    paths:
      - "governance_gateway/**"
      - "tests/test_gateway_policy.py"
      - "docs/security-gateway.md"
      - ".github/workflows/p0-gateway-reference.yml"
  push:
    branches: [main]
    paths:
      - "governance_gateway/**"
      - "tests/test_gateway_policy.py"
      - "docs/security-gateway.md"
      - ".github/workflows/p0-gateway-reference.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference-policy:
    name: P0 gateway reference negative tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Read-only checkout (SHA-pinned)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Python toolchain (SHA-pinned)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run synthetic denial matrix
        run: python -m unittest discover -s tests -p "test_gateway_policy.py" -v
